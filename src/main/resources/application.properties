spring.application.name=geulkkaebi

# server port
server.port=8090

# DB connection
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=geulkkaebi
spring.datasource.password=0000
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# mybatis aliases
mybatis.type-aliases-package=kr.ac.kopo.geulkkaebi.user, kr.ac.kopo.geulkkaebi.quiz

# mapper
mybatis.mapper-locations=classpath:mapper/*.xml

# snake case <-> kamel case
# https://coding-nyan.tistory.com/163#application.properties%EC%9D%98%20%EA%B2%BD%EC%9A%B0-1
mybatis.configuration.map-underscore-to-camel-case=true

# mybatis log check
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl